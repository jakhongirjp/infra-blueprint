# App-of-apps: Argo CD watches this repository and creates one Application per
# file in k8s/argocd/apps/<env>. Bootstrapping a new cluster is a single
# `kubectl apply -f k8s/argocd/root.yaml`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakhongirjp/infra-blueprint
    targetRevision: main
    path: k8s/argocd/apps/production
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
